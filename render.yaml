services:
  - type: web
    name: simuladoph
    runtime: python
    buildCommand: pip install -r requirements.txt && python importar_questoes.py
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: simuladoph-db
          property: connectionString

databases:
  - name: simuladoph-db
    plan: free