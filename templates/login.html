{% extends "base.html" %}
{% block title %}Login — SimuladoPH{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto fade-in">
  <div class="text-center mb-8">
    <div class="text-5xl mb-3">📚</div>
    <h1 class="text-2xl font-bold text-indigo-700">SimuladoPH</h1>
    <p class="text-slate-500 text-sm mt-1">Treine até dominar todas as questões</p>
  </div>

  <div class="bg-white rounded-2xl shadow-sm p-8">
    <h2 class="text-lg font-semibold mb-6">Entrar</h2>
    <form method="POST" action="{{ url_for('login') }}" class="space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1">E-mail</label>
        <input type="email" name="email" required autofocus
          class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Senha</label>
        <input type="password" name="senha" required
          class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
      </div>
      <button type="submit"
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 rounded-lg transition">
        Entrar
      </button>
    </form>

    <p class="text-center text-sm text-slate-500 mt-6">
      Não tem conta?
      <a href="{{ url_for('registro') }}" class="text-indigo-600 font-medium hover:underline">Cadastre-se</a>
    </p>
  </div>
</div>
{% endblock %}
