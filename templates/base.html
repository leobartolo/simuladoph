<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}SimuladoPH{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    .fade-in { animation: fadeIn .35s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

  {% if current_user.is_authenticated %}
  <nav class="bg-indigo-700 text-white shadow-md">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="{{ url_for('dashboard') }}" class="font-bold text-lg tracking-tight">📚 SimuladoPH</a>
      <div class="flex items-center gap-4 text-sm">
        <span class="opacity-75">{{ current_user.nome }}</span>
        <a href="{{ url_for('novo_simulado') }}" class="bg-white text-indigo-700 font-semibold px-3 py-1 rounded-lg hover:bg-indigo-50 transition">Novo simulado</a>
        <a href="{{ url_for('logout') }}" class="opacity-75 hover:opacity-100 transition">Sair</a>
      </div>
    </div>
  </nav>
  {% endif %}

  <main class="max-w-3xl mx-auto px-4 py-8">

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="mb-4 px-4 py-3 rounded-lg text-sm font-medium
          {% if cat == 'danger' %}bg-red-100 text-red-800
          {% elif cat == 'success' %}bg-green-100 text-green-800
          {% elif cat == 'warning' %}bg-yellow-100 text-yellow-800
          {% else %}bg-blue-100 text-blue-800{% endif %}">
          {{ msg }}
        </div>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

</body>
</html>
